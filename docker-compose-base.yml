services:
  mariadb-app:
    image: mariadb
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 300s
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: yes
      MARIADB_USER: uuru
      MARIADB_DATABASE: uuru
      MARIADB_PASSWORD: uurupassword
    ports:
      - 127.0.0.1:3307:3306

  mariadb-asterisk:
    image: mariadb
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 300s
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: yes
      MARIADB_USER: asterisk
      MARIADB_DATABASE: asterisk
      MARIADB_PASSWORD: asteriskpassword
    ports:
      - 127.0.0.1:3306:3306

  asterisk:
    build: asterisk/
    image: olel/uuru-asterisk:latest
    depends_on:
      mariadb-asterisk:
        condition: service_healthy
    environment:
      MARIADB_DATABASE: asterisk
      MARIADB_HOST: 127.0.0.1
      MARIADB_USER: asterisk
      MARIADB_PASSWORD: asteriskpassword
    network_mode: host

  ldap:
    image: osixia/openldap:1.5.0
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldapi:///", "-b", "", "-s", "base"]
      interval: 10s
      start_period: 30s
      timeout: 5s
      retries: 3
    environment:
      - LDAP_ORGANISATION=uuru
      - LDAP_DOMAIN=uuru
      - LDAP_BASE_DN=dc=uuru
      - LDAP_ADMIN_PASSWORD=password
      - LDAP_CONFIG_PASSWORD=password
      - LDAP_READONLY_USER=true
      - LDAP_READONLY_USER_USERNAME=public
      - LDAP_READONLY_USER_PASSWORD=public
    ports:
      - 0.0.0.0:389:3890
      - 0.0.0.0:636:6360
